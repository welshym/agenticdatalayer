# Billing SoR — Customer Subscription Records
# =============================================
# Authoritative per-customer subscription state for the mocked billing system.
# Edit this file to change subscription data, statuses, or discount codes.
# Changes take effect on next service startup.
#
# Fields mirror the SoR raw schema:
#   cust_ref              — SoR customer reference key (foreign key to CRM)
#   sub_lines[]           — list of subscription lines
#     sku                 — product SKU (foreign key to catalogue)
#     stat                — status: A (active), S (suspended), C (cancelled)
#     eff_from            — effective-from date (ISO 8601)
#     list_price_gbp      — catalogue list price in GBP at time of last billing event;
#                           used as the base price for discount rule evaluation
#     monthly_charge      — contracted price in GBP paid by the customer after all
#                           applicable discounts have been applied
#     total_discount_pct  — combined discount percentage across all fired policies
#     applied_discounts   — policies that fired: [{policy_id, discount_pct, reason}]
#     contract_term_months — contract duration: 1 = monthly rolling, 24 = two-year
#
# Discounts are evaluated at billing-event time (recalculate, new subscription).
# The same rules/discounts.yaml policies are re-applied whenever monthly_charge
# is recalculated from an updated list price.

